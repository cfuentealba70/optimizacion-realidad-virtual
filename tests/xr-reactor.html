<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de sesión VR emulada · reactor</title>
<link rel="stylesheet" href="../css/site.css">
<script type="importmap">
{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
</script>
</head>
<body class="scene">
<div id="app"></div>
<div class="hud" id="hud"><h1>Prueba VR emulada</h1></div>
<div class="controls" id="controls">
  <button class="btn" id="b-play">Pausar</button><button class="btn" id="b-reset">Reiniciar</button>
  <input type="range" id="r-t" min="0" max="12" step="0.01" value="0"><output id="o-t"></output>
  <button class="btn" id="b-deriv">Derivada</button><button class="btn" id="b-max">Revelar máximo</button>
</div>
<script type="module">
// Solo para desarrollo: emula unas gafas Meta Quest 3 con IWER (npm install) para probar la sesión VR sin casco.
import { XRDevice, metaQuest3 } from '../node_modules/iwer/build/iwer.module.js';
const device = new XRDevice(metaQuest3);
device.installRuntime({ forceInstall: true });
device.position.set(0, 1.6, 0);
window.__xrdev = device;
await import('../reactor/scene.js');
</script>
</body>
</html>
